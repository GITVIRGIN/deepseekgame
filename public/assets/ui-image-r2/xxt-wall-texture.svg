<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Xiaoxitian mural wall texture">
  <defs>
    <pattern id="brick" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30H60M30 0V30M0 60V30M60 60V30" fill="none" stroke="#c5a55b" stroke-opacity=".08" stroke-width="1"/>
      <path d="M8 12c12-8 24-8 36 0 9 6 10 17 2 25-11 11-27 11-38 0-8-8-7-19 0-25Z" fill="none" stroke="#7d4b32" stroke-opacity=".10" stroke-width="1.2"/>
      <path d="M42 40c8-4 15-4 22 1M13 48c11-3 20-2 28 3" fill="none" stroke="#4f735f" stroke-opacity=".09" stroke-width="1.3" stroke-linecap="round"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="16"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="180" height="180" fill="#201713"/>
