name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages Artifact
        shell: bash
        run: |
          rm -rf .pages
          mkdir -p .pages/assets
          cp index.html .pages/
          cp -R src .pages/src
          cp -R public .pages/public
          cp -R public/assets/. .pages/assets/
          if [ -f assets/seal.svg ]; then
            mkdir -p .pages/assets
            cp assets/seal.svg .pages/assets/seal.svg
          fi
          touch .pages/.nojekyll
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
